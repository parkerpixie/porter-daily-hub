[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  function = "add-social-meta"
  path = "/"

[[redirects]]
  from = "/porter-day-arc-icon.png"
  to = "/.netlify/functions/porter-assets"
  status = 200
  force = true

[[redirects]]
  from = "/api/calendar"
  to = "/.netlify/functions/calendar"
  status = 200

[[redirects]]
  from = "/api/packrat"
  to = "/.netlify/functions/packrat"
  status = 200

[[redirects]]
  from = "/packrat"
  to = "/.netlify/functions/packrat-site"
  status = 200
  force = true

[[redirects]]
  from = "/packrat/"
  to = "/.netlify/functions/packrat-site"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
