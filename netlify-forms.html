<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Netlify Forms</title>
</head>
<body>
  <!-- Static form definition used by Netlify's deploy-time form scanner. -->
  <form name="porter-packing-complete" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="porter-packing-complete">
    <p hidden>
      <label>Do not fill this out: <input name="bot-field"></label>
    </p>
    <input type="hidden" name="subject" value="Porter has completed their packing">
    <input type="hidden" name="message" value="Porter has completed their packing.">
    <input type="hidden" name="season">
    <input type="hidden" name="recipients">
    <input type="hidden" name="completed_at">
    <button type="submit">Submit</button>
  </form>
</body>
</html>
